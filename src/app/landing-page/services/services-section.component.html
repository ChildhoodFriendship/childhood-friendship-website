<section class="content-section section-shell" id="servizi" aria-labelledby="services-title">
  <div class="section-heading">
    <p class="eyebrow">Le nostre competenze</p>
    <h2 id="services-title">Non vendiamo pacchetti.<br><em>Costruiamo possibilità.</em></h2>
  </div>
  <div class="service-grid">
    @for (service of services; track service.number) {
      <article class="service-card">
        <div class="card-topline"><span>{{ service.number }}</span><span class="card-arrow" aria-hidden="true">↗</span></div>
        <h3>{{ service.title }}</h3>
        <p>{{ service.description }}</p>
        <div class="tag-list" aria-label="Specializzazioni">
          @for (tag of service.tags; track tag) {
            <span>{{ tag }}</span>
          }
        </div>
      </article>
    }
  </div>
</section>
