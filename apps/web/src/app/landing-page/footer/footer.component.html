<footer class="site-footer section-shell">
  <a class="brand" href="#top" aria-label="Childhood Friendship">
    <cf-logo class="brand-mark" />
    <span class="brand-name">Childhood <strong>Friendship</strong></span>
  </a>
  <p>{{ i18n.landing().footer.quote }} · {{ legal.city }}</p>
  <nav class="footer-meta" [attr.aria-label]="i18n.landing().footer.legalAria">
    <span>© 2026 Childhood Friendship</span>
    <a routerLink="/privacy">{{ i18n.landing().footer.privacy }}</a>
    <a routerLink="/cookie">{{ i18n.landing().footer.cookie }}</a>
    <a href="/caveau">{{ i18n.landing().footer.caveau }}</a>
  </nav>
</footer>
