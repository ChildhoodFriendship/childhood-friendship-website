<section class="contact-section section-shell" id="contatti" aria-labelledby="contact-title">
  <div class="contact-card">
    <div>
      <p class="eyebrow">Hai un'idea?</p>
      <h2 id="contact-title">Diamo forma a qualcosa<br><em>che resta.</em></h2>
      <p class="contact-note">Rispondiamo entro un giorno lavorativo con una prima stima di tempi e costi.</p>
    </div>
    <form class="contact-form" (submit)="submitContactForm($event, contactForm)" #contactForm novalidate>
      <div class="pair">
        <div class="cell">
          <label for="contact-name">Nome *</label>
          <input id="contact-name" name="name" type="text" autocomplete="name" minlength="2" maxlength="120" required>
        </div>
        <div class="cell">
          <label for="contact-company">Azienda</label>
          <input id="contact-company" name="company" type="text" autocomplete="organization" maxlength="200">
        </div>
      </div>
      <div class="pair">
        <div class="cell">
          <label for="contact-email">Email *</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="cell">
          <label for="contact-phone">Telefono</label>
          <input id="contact-phone" name="phone" type="tel" autocomplete="tel" maxlength="40">
        </div>
      </div>

      <label for="contact-service">Di cosa hai bisogno?</label>
      <select id="contact-service" name="service">
        @for (s of services; track s.value) { <option [value]="s.value">{{ s.label }}</option> }
      </select>

      <label for="contact-message">Raccontaci il tuo progetto *</label>
      <textarea id="contact-message" name="message" rows="5" minlength="10" maxlength="5000" required></textarea>

      <label class="honeypot" for="contact-website">Lascia vuoto questo campo</label>
      <input id="contact-website" class="honeypot" name="website" type="text" tabindex="-1" autocomplete="off">

      <label class="privacy">
        <input type="checkbox" name="privacy" required>
        <span>Acconsento al trattamento dei dati per essere ricontattato (GDPR art. 6.1.b).</span>
      </label>

      <button class="button button-light" type="submit" [disabled]="submissionState() === 'submitting'">
        {{ submissionState() === 'submitting' ? 'Invio in corso…' : 'Invia il messaggio' }} <span aria-hidden="true">↗</span>
      </button>
      <p class="form-status" [class.form-status-success]="submissionState() === 'success'" [class.form-status-error]="submissionState() === 'error'" aria-live="polite">
        @switch (submissionState()) {
          @case ('success') { Grazie, abbiamo ricevuto la tua richiesta: ti ricontattiamo a breve. }
          @case ('error') { {{ errorMessage() }} }
        }
      </p>
    </form>
  </div>
</section>
